name = "cloud-mail-api"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[routes]]
pattern = "mail.airoute.kdns.fr"
custom_domain = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "cloud-mail-api"		#d1数据库名字
database_id = "a99b0859-0c89-49de-8af1-a19b45c94e2c"		#d1数据库id

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "2a56f3742be04a37a0fdf8e359023ca4"					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#每天晚上12点执行每日任务,刷新分析缓存


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
domain = ["mail.airoute.kdns.fr"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "admin@mail.airoute.kdns.fr"				#管理员的邮箱	示例: admin@example.com
project_link = "https://github.com/hansomgar/cloud-mail-api"
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串

[build]
command = "npx --yes pnpm@9.15.9 --prefix ../mail-vue install --frozen-lockfile && npx --yes pnpm@9.15.9 --prefix ../mail-vue run build"
